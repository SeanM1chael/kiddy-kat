<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kiddy Kat Dashboard</title>
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="dashboard-manifest.json">
  <style>
    :root { --main: #ff7a00; --bg: #fff4e6; --ok: #2b8a3e; --warn: #e8590c; --muted: #868e96; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); margin: 0;
           padding: 16px; color: #212529; }
    h1 { color: var(--main); margin: 4px 0 2px; font-size: 28px; }
    .sub { color: var(--muted); margin-bottom: 14px; font-size: 14px; }
    button { font-size: 16px; padding: 10px 18px; border: none; border-radius: 12px;
             background: var(--main); color: white; cursor: pointer; }
    button.plain { background: #eee; color: #333; }
    #login { max-width: 360px; margin: 10vh auto; background: white; padding: 24px; border-radius: 20px; text-align: center; }
    #login input { display: block; width: 100%; font-size: 20px; padding: 12px; margin: 10px 0;
                   border: 2px solid #ffd8a8; border-radius: 12px; text-align: center; }
    #loginNote { margin-top: 10px; color: var(--warn); }
    #board { display: none; }
    .bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .kids { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 14px; }
    .kid { background: white; border-radius: 20px; padding: 16px; }
    .kidHead { display: flex; align-items: center; gap: 10px; }
    .kidHead .face { font-size: 40px; }
    .kidHead .name { font-size: 22px; font-weight: bold; }
    .kidHead .seen { color: var(--muted); font-size: 13px; }
    .section { margin-top: 12px; padding-top: 10px; border-top: 1px solid #f1f3f5; }
    .section h3 { margin: 0 0 6px; font-size: 15px; color: #495057; }
    .list { display: flex; justify-content: space-between; padding: 4px 0; }
    .done { color: var(--ok); font-weight: bold; }
    .partial { color: var(--warn); font-weight: bold; }
    .none { color: var(--muted); }
    .left { color: var(--muted); font-size: 14px; padding: 0 0 4px 12px; }
    .waiting { background: #fff3bf; border-radius: 10px; padding: 8px 10px; margin: 6px 0; font-size: 15px; }
    .waiting .buttons { display: flex; gap: 6px; margin-top: 6px; }
    .waiting button { font-size: 14px; padding: 6px 12px; border-radius: 10px; }
    .waiting button.no { background: #eee; color: #333; }
    .waiting.sent { background: #e7f5ff; }
    .row { display: flex; justify-content: space-between; padding: 2px 0; }
    .empty { color: var(--muted); }
    #pushBox { background: white; border-radius: 16px; padding: 10px 14px; margin-bottom: 12px; font-size: 15px; }
    #pushBox button { font-size: 14px; padding: 6px 12px; margin-top: 6px; }
    .pushNote { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .gift { margin-top: 12px; }
    .gift .amounts { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
    .gift .amounts button { background: #fff3bf; color: #333; padding: 6px 12px; }
    .gift .amounts button.picked { background: var(--main); color: white; }
    .gift input, #fans input { width: 100%; font-size: 15px; padding: 8px; border: 2px solid #ffd8a8; border-radius: 10px; margin: 4px 0; }
    .giftList { font-size: 14px; color: #495057; padding: 2px 0; }
    #leaguePanel { background: white; border-radius: 20px; padding: 16px; margin-bottom: 14px; }
    #leaguePanel h3 { margin: 0 0 8px; }
    #leaguePanel input { width: 100%; font-size: 15px; padding: 8px; border: 2px solid #ffd8a8; border-radius: 10px; margin: 4px 0; }
    #leaguePanel button { font-size: 14px; padding: 6px 12px; margin: 4px 4px 0 0; }
    .leagueCols { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 8px; }
    .leagueCols > div { background: #fff9db; border-radius: 12px; padding: 8px 10px; font-size: 14px; }
    #sendPanel { background: white; border-radius: 20px; padding: 16px; margin-bottom: 14px; }
    #sendPanel h3 { margin: 0 0 4px; }
    #sendPanel h4 { margin: 10px 0 4px; }
    #sendPanel input:not([type=checkbox]) { width: 100%; font-size: 15px; padding: 8px; border: 2px solid #ffd8a8; border-radius: 10px; margin: 4px 0; box-sizing: border-box; }
    #sendPanel button { font-size: 14px; padding: 6px 12px; margin: 6px 4px 0 0; }
    #sendPanel label { margin-right: 12px; white-space: nowrap; }
    .eventRow { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 4px 0; border-top: 1px solid #f1f3f5; font-size: 14px; }
    .eventRow .who { color: var(--muted); }
    #familyPanel { background: white; border-radius: 20px; padding: 16px; margin-top: 14px; }
    #familyPanel h3 { margin: 0 0 6px; }
    #familyPanel input { width: 100%; font-size: 15px; padding: 8px; border: 2px solid #ffd8a8; border-radius: 10px; margin: 4px 0; }
    #familyPanel button { font-size: 14px; padding: 6px 12px; margin: 6px 6px 0 0; }
    #familyPanel button.danger { background: #c92a2a; }
    .dangerBox { border: 2px solid #ffc9c9; border-radius: 12px; padding: 10px 12px; margin-top: 8px; }
    #shopPanel { background: white; border-radius: 20px; padding: 16px; margin-bottom: 14px; }
    #shopPanel h3 { margin: 0 0 6px; }
    #shopPanel button { font-size: 14px; padding: 6px 12px; }
    #sendPanel select { font-size: 15px; padding: 6px; border: 2px solid #ffd8a8; border-radius: 10px; margin: 4px 0; }
    #fans { background: white; border-radius: 20px; padding: 16px; margin-bottom: 14px; }
    #fans h3 { margin: 0 0 8px; }
    .fanRow { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; }
    .fanRow button, #fans .small { font-size: 14px; padding: 6px 12px; }
    .fanForm { display: none; margin-top: 8px; }
    .fanLink { font-size: 14px; color: var(--muted); margin-top: 8px; }
  </style>
</head>
<body>
  <!-- Grown-up login -->
  <div id="login">
    <h1>🐱 Kiddy Kat</h1>
    <div class="sub">Grown-ups dashboard</div>
    <input id="code" placeholder="Family code" autocapitalize="characters">
    <input id="pin" type="password" inputmode="numeric" placeholder="Online parent PIN">
    <button onclick="logIn()">Log in</button>
    <div id="loginNote"></div>
    <div class="sub" style="margin-top:14px">New to Kiddy Kat? <a href="signup.html">Start your family</a></div>
  </div>

  <!-- The dashboard -->
  <div id="board">
    <h1 id="familyName">🐱 Kiddy Kat</h1>
    <div class="sub" id="updated"></div>
    <div class="bar">
      <button onclick="loadBoard()">🔄 Refresh</button>
      <button class="plain" onclick="logOut()">Log out</button>
    </div>
    <div id="pushBox"></div>
    <div id="sendPanel"></div>
    <div id="shopPanel"></div>
    <div id="leaguePanel"></div>
    <div id="fans"></div>
    <div class="kids" id="kids"></div>
    <div id="familyPanel"></div>
  </div>

  <script src="config.js?v=2026-10-29f"></script>
  <script src="push.js?v=2026-10-29f"></script>
  <script>
    // =================================================================
    // Parent dashboard: every kid's day at a glance (read-only).
    // Approvals still happen in ⚙️ Grown-ups on each kid's phone.
    // The grown-up login lasts until this browser tab is closed.
    // =================================================================

    const ANIMALS = { kitten: '🐱', tiger: '🐯', lion: '🦁', eagle: '🦅' };
    const PET_STAGES = {
      kitten: ['🥚', '🐱', '😺', '🐈'], puppy: ['🥚', '🐶', '🐕', '🦮'], bunny: ['🥚', '🐰', '🐇', '🐇'],
      flower: ['🌰', '🌱', '🌷', '🌻'], hamster: ['🥚', '🐭', '🐹', '🐹'], turtle: ['🥚', '🐢', '🐢', '🐢'],
      parrot: ['🥚', '🐣', '🐥', '🦜'], unicorn: ['🥚', '🦄', '🦄', '🦄'], dragon: ['🥚', '🦎', '🐲', '🐉'],
      // Grown-up projects (career mode)
      startup: ['💡', '🛠️', '🚀', '🏢'], bonsai: ['🌰', '🌱', '🪴', '🌳'], summit: ['🏕️', '🥾', '🧗', '🏔️'],
      home: ['📐', '🧱', '🏗️', '🏡'], dog: ['🐾', '🐶', '🐕', '🦮'], eaglet: ['🪺', '🐣', '🐥', '🦅']
    };
    const STAGE_POINTS = [0, 3, 15, 40];
    const LISTS = [['morning', '☀️ Morning'], ['afternoon', '🎒 After School'], ['bedtime', '🌙 Bedtime']];

    // Same forgiving family code as the kid app
    function cleanFamilyCode(text) {
      let code = String(text || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (code.startsWith('KAT') && code.length > 6) code = code.slice(3);
      return 'KAT-' + code;
    }

    async function cloudCall(name, args) {
      try {
        const response = await fetch(`${KIDDY_KAT_CLOUD.url}/rest/v1/rpc/${name}`, {
          method: 'POST',
          headers: { apikey: KIDDY_KAT_CLOUD.key, 'Content-Type': 'application/json' },
          body: JSON.stringify(args)
        });
        const body = await response.json().catch(() => ({}));
        if (!response.ok) return { ok: false, error: body.message || `Server error ${response.status}` };
        return body;
      } catch (err) {
        return { ok: false, error: 'No internet right now' };
      }
    }

    // ---------- Logging in and out ----------
    async function logIn() {
      const note = document.getElementById('loginNote');
      note.textContent = '⏳ Checking...';
      const result = await cloudCall('parent_login', {
        p_code: cleanFamilyCode(document.getElementById('code').value),
        p_pin: document.getElementById('pin').value
      });
      if (!result.ok) { note.textContent = '⚠️ ' + result.error; return; }
      sessionStorage.setItem('kiddyKatDashToken', result.token);    // forgotten when the tab closes
      document.getElementById('pin').value = '';
      note.textContent = '';
      loadBoard();
    }

    function logOut() {
      sessionStorage.removeItem('kiddyKatDashToken');
      document.getElementById('board').style.display = 'none';
      document.getElementById('login').style.display = 'block';
    }

    // ---------- Loading everyone ----------
    async function loadBoard() {
      const token = sessionStorage.getItem('kiddyKatDashToken');
      if (!token) { logOut(); return; }
      const result = await cloudCall('family_overview', { p_token: token });
      if (!result.ok) {
        logOut();
        document.getElementById('loginNote').textContent = '⚠️ ' + result.error;
        return;
      }
      document.getElementById('login').style.display = 'none';
      document.getElementById('board').style.display = 'block';
      document.getElementById('familyName').textContent = `🐱 ${result.family}`;
      document.getElementById('updated').textContent = `Updated ${new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`;
      const box = document.getElementById('kids');
      box.textContent = '';
      if (!result.kids.length) box.textContent = 'No kids yet. Add them in ⚙️ Grown-ups → ☁️ Online family on their phones.';
      const uploads = await cloudCall('list_uploads', { p_token: token });
      uploadCounts = {};
      (uploads.uploads || []).forEach(u => uploadCounts[u.nickname] = (uploadCounts[u.nickname] || 0) + 1);
      result.kids.forEach(kid => box.appendChild(kidCard(kid)));
      if (!document.getElementById('pushBox').childElementCount)
        pushSwitch(document.getElementById('pushBox'), () => sessionStorage.getItem('kiddyKatDashToken'), 'this device (grown-up alerts)');
      showSendPanel(result.kids);
      showShoppingList(result.kids);
      showFamilyPanel(result.family);
      showFans();
      showLeaguePanel();
    }

    // ---------- League and team goal ----------
    async function showLeaguePanel() {
      const box = document.getElementById('leaguePanel');
      const token = sessionStorage.getItem('kiddyKatDashToken');
      const [standings, team] = await Promise.all([cloudCall('league_standings', { p_token: token }),
                                                  cloudCall('family_team', { p_token: token })]);
      box.textContent = '';
      const add = (parent, tag, text, cls) => { const el = document.createElement(tag); if (text !== undefined) el.textContent = text; if (cls) el.className = cls; parent.appendChild(el); return el; };
      add(box, 'h3', '🏆 League and team goal');
      if (!standings.ok) { add(box, 'div', '⚠️ ' + standings.error, 'empty'); return; }
      if (team.ok) add(box, 'div', `🤝 Team goal this week: ${team.total} of ${team.goal} points` +
                                   (team.total >= team.goal ? ' ✅ Reached! Everyone gets +10 ⭐' : ''));

      if (!standings.in_league) {
        add(box, 'div', 'Start a private league with cousins or friends, or join one with a code from another parent.', 'empty');
        const name = add(box, 'input'); name.placeholder = 'League name, like Cousins League';
        add(box, 'button').textContent = '➕ Start a league';
        box.lastChild.addEventListener('click', async () => {
          const r = await cloudCall('create_league', { p_token: token, p_name: name.value });
          if (!r.ok) { alert(r.error); return; }
          showLeaguePanel();
        });
        const code = add(box, 'input'); code.placeholder = 'League code from another parent, like LG-7QM4XZ';
        add(box, 'button').textContent = '🔗 Join league';
        box.lastChild.addEventListener('click', async () => {
          const r = await cloudCall('join_league', { p_token: token, p_code: code.value });
          if (!r.ok) { alert(r.error); return; }
          showLeaguePanel();
        });
        return;
      }

      add(box, 'div', `${standings.name} · code ${standings.code} (share it with other parents)` +
                      (standings.league_on ? '' : ' · ⏸️ Turned off for your kids'));
      const cols = add(box, 'div', undefined, 'leagueCols');
      Object.keys(standings.groups).forEach(animal => {
        const g = standings.groups[animal];
        const col = add(cols, 'div');
        add(col, 'b', `${ANIMALS[animal] || ''} ${animal}s`);
        g.top.forEach(k => add(col, 'div', `👑 ${k.nickname} (${k.family}): ${k.points}`));
        if (g.others.length) add(col, 'div', 'Also: ' + g.others.map(k => k.nickname + (k.goal ? ' ⭐' : '')).join(', '));
      });
      if (standings.cup.length) add(box, 'div', '🏅 Family Cup: ' + standings.cup.map((c, i) => `${['🥇', '🥈', '🥉'][i]} ${c.family} (${c.average} avg)`).join('  '));
      const toggle = add(box, 'button', standings.league_on ? '⏸️ Turn off for my kids' : '▶️ Turn back on', 'plain');
      toggle.addEventListener('click', async () => {
        await cloudCall('set_league_on', { p_token: token, p_on: !standings.league_on });
        showLeaguePanel();
      });
      const leave = add(box, 'button', 'Leave league', 'plain');
      leave.addEventListener('click', async () => {
        if (!confirm(`Leave ${standings.name}?`)) return;
        await cloudCall('leave_league', { p_token: token });
        showLeaguePanel();
      });
    }

    // ---------- Fans (grandparents, aunts, uncles) ----------
    // ---------- 📣 Send to the kids: special days for everyone at once ----------
    function localDateKey(d) {
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    }

    // Upcoming special days for each kid: what's on their phone, plus what's waiting in their inbox
    function upcomingEvents(kids) {
      const today = localDateKey(new Date());
      const byDay = new Map();
      kids.forEach(kid => {
        const data = kid.data || {};
        const mine = new Map();
        (read(data, 'kiddyKatEvents', []) || []).forEach(e => mine.set(e.date + '|' + e.tip, e));
        (read(data, 'kiddyKatParentInbox', []) || []).filter(d => d.type === 'event').forEach(d => {
          if (d.remove) mine.delete(d.date + '|' + d.tip); else mine.set(d.date + '|' + d.tip, { date: d.date, tip: d.tip });
        });
        mine.forEach((e, key) => {
          if (e.date < today) return;
          if (!byDay.has(key)) byDay.set(key, { date: e.date, tip: e.tip, kids: [] });
          byDay.get(key).kids.push(kid.nickname);
        });
      });
      return [...byDay.values()].sort((a, b) => a.date.localeCompare(b.date));
    }

    // 💬 A short message for the kids' home screen ("Be great today, son!")
    function addMessageBox(box, kids, add) {
      add(box, 'h4', '💬 Message');
      const text = add(box, 'input'); text.placeholder = 'Be great today! Love, Dad'; text.maxLength = 140;
      const who = add(box, 'div');
      const checks = kids.map(kid => {
        const label = add(who, 'label');
        const c = add(label, 'input'); c.type = 'checkbox'; c.checked = true; c.value = kid.nickname;
        label.append(' ' + kid.nickname);
        return c;
      });
      const days = add(box, 'select');
      [['1', 'Show today'], ['3', 'Show for 3 days'], ['7', 'Show for a week']].forEach(([v, l]) => days.add(new Option(l, v)));
      const send = add(box, 'button', '💬 Send message');
      const note = add(box, 'div', '', 'pushNote');
      send.addEventListener('click', async () => {
        const picked = checks.filter(c => c.checked).map(c => c.value);
        if (!text.value.trim()) { note.textContent = 'Type a message.'; return; }
        if (!picked.length) { note.textContent = 'Pick at least one kid.'; return; }
        const token = sessionStorage.getItem('kiddyKatDashToken');
        let from = 'Dad';
        try { from = localStorage.getItem('kiddyKatDashFrom') || 'Dad'; } catch (err) {}
        note.textContent = '⏳ Sending...';
        const r = await cloudCall('parent_send', { p_token: token, p_nicknames: picked, p_kind: 'note',
                                                   p_text: text.value.trim(), p_from: from, p_days: Number(days.value) });
        if (!r.ok) { note.textContent = '⚠️ ' + r.error; return; }
        picked.forEach(n => pushSend(token, 'note', text.value.trim(), n));
        note.textContent = `✅ Sent to ${picked.join(', ')}. It shows at the top of their app.`;
        text.value = '';
      });
    }

    // 🛒 Shopping list: every kid's supplies that are running low or out
    function showShoppingList(kids) {
      const box = document.getElementById('shopPanel');
      box.textContent = '';
      const add = (parent, tag, text, cls) => { const el = document.createElement(tag); if (text !== undefined) el.textContent = text; if (cls) el.className = cls; parent.appendChild(el); return el; };
      add(box, 'h3', '🛒 Shopping list');
      let count = 0;
      kids.forEach(kid => {
        const data = kid.data || {};
        const supplies = read(data, 'kiddyKatSupplies', []) || [];
        const inbox = read(data, 'kiddyKatParentInbox', []) || [];
        supplies.filter(i => i.status === 'low' || i.status === 'out').forEach(item => {
          count += 1;
          const row = add(box, 'div', undefined, 'eventRow');
          add(row, 'span', `${item.emoji || '🧴'} ${item.name} for ${kid.nickname} ${item.status === 'out' ? '🔴 all out' : '🟡 running low'}`);
          const already = inbox.some(d => d.type === 'bought' && d.text.toLowerCase() === item.name.toLowerCase());
          if (already) { add(row, 'span', '⏳ Bought, updates when their app opens', 'who'); return; }
          const bought = add(row, 'button', '✅ Bought it');
          bought.addEventListener('click', async () => {
            const token = sessionStorage.getItem('kiddyKatDashToken');
            let from = 'Dad';
            try { from = localStorage.getItem('kiddyKatDashFrom') || 'Dad'; } catch (err) {}
            bought.textContent = '⏳';
            const r = await cloudCall('parent_send', { p_token: token, p_nicknames: [kid.nickname], p_kind: 'bought',
                                                       p_text: item.name, p_from: from, p_days: 1 });
            if (!r.ok) { bought.textContent = '⚠️ ' + r.error; return; }
            pushSend(token, 'bought', item.name, kid.nickname);
            loadBoard();
          });
        });
      });
      if (!count) add(box, 'div', '✅ Nothing needed. Kids mark supplies as low in 🧴 My supplies, and they show up here.', 'empty');
    }

    function showSendPanel(kids) {
      const box = document.getElementById('sendPanel');
      box.textContent = '';
      const add = (parent, tag, text, cls) => { const el = document.createElement(tag); if (text !== undefined) el.textContent = text; if (cls) el.className = cls; parent.appendChild(el); return el; };
      add(box, 'h3', '📣 Send to the kids');
      addMessageBox(box, kids, add);
      add(box, 'h4', '📅 Special day');
      add(box, 'div', 'Dress-up day, picture day, a field trip. It shows on their blue card that day, with a heads-up the afternoon before.', 'pushNote');
      const date = add(box, 'input'); date.type = 'date'; date.min = localDateKey(new Date());
      const tip = add(box, 'input'); tip.placeholder = '🎃 Halloween dress-up day! Wear your costume'; tip.maxLength = 120;
      const who = add(box, 'div');
      const checks = kids.map(kid => {
        const label = add(who, 'label');
        const c = add(label, 'input'); c.type = 'checkbox'; c.checked = true; c.value = kid.nickname;
        label.append(' ' + kid.nickname);
        return c;
      });
      const send = add(box, 'button', '📣 Send special day');
      const note = add(box, 'div', '', 'pushNote');

      const sendEvent = async (day, text, nicknames, remove) => {
        const token = sessionStorage.getItem('kiddyKatDashToken');
        const r = await cloudCall('parent_add_event', { p_token: token, p_nicknames: nicknames, p_date: day, p_tip: text, p_remove: remove });
        if (!r.ok) return r;
        if (!remove) {
          const when = new Date(day + 'T12:00').toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
          nicknames.forEach(n => pushSend(token, 'event', `${when}: ${text}`, n));      // alert each kid's phone
        }
        return r;
      };

      send.addEventListener('click', async () => {
        const picked = checks.filter(c => c.checked).map(c => c.value);
        if (!date.value || !tip.value.trim()) { note.textContent = 'Pick a date and type what the day is.'; return; }
        if (!picked.length) { note.textContent = 'Pick at least one kid.'; return; }
        note.textContent = '⏳ Sending...';
        const r = await sendEvent(date.value, tip.value.trim(), picked, false);
        if (!r.ok) { note.textContent = '⚠️ ' + r.error; return; }
        note.textContent = `✅ Sent to ${picked.join(', ')}. It shows up when their app opens.`;
        tip.value = '';
        loadBoard();
      });

      const coming = upcomingEvents(kids);
      if (coming.length) {
        add(box, 'h4', 'Coming up');
        coming.forEach(e => {
          const row = add(box, 'div', undefined, 'eventRow');
          const when = new Date(e.date + 'T12:00').toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
          const text = add(row, 'span', `${when}: ${e.tip} `);
          add(text, 'span', `(${e.kids.join(', ')})`, 'who');
          const remove = add(row, 'button', 'Remove', 'plain');
          remove.addEventListener('click', async () => {
            if (!confirm(`Remove "${e.tip}" for ${e.kids.join(', ')}?`)) return;
            const r = await sendEvent(e.date, e.tip, e.kids, true);
            if (!r.ok) { note.textContent = '⚠️ ' + r.error; return; }
            loadBoard();
          });
        });
      }
    }

    // ---------- Family settings: privacy and Delete my family ----------
    function showFamilyPanel(familyName) {
      const box = document.getElementById('familyPanel');
      box.textContent = '';
      const add = (parent, tag, text, cls) => { const el = document.createElement(tag); if (text !== undefined) el.textContent = text; if (cls) el.className = cls; parent.appendChild(el); return el; };
      add(box, 'h3', '🔒 Family settings');
      const policy = add(box, 'a', 'Privacy policy');
      policy.href = 'privacy.html';
      policy.target = '_blank';
      const open = add(add(box, 'div'), 'button', '🗑️ Delete my family', 'plain');
      const form = add(box, 'div', undefined, 'dangerBox');
      form.style.display = 'none';
      add(form, 'div', `This permanently deletes ${familyName} from Kiddy Kat: every kid, their progress, stars, pets, ` +
        'photos, Fans, alert devices and logins. It can\'t be undone. Progress saved only on a kid\'s device stays there until you remove the app.');
      const code = add(form, 'input'); code.placeholder = 'Type your family code (KAT-XXXXXX)'; code.autocapitalize = 'characters';
      const pin = add(form, 'input'); pin.type = 'password'; pin.inputMode = 'numeric'; pin.placeholder = 'Parent PIN';
      const go = add(form, 'button', 'Delete everything', 'danger');
      const cancel = add(form, 'button', 'Cancel', 'plain');
      const note = add(form, 'div', '', 'pushNote');
      open.addEventListener('click', () => { form.style.display = 'block'; open.style.display = 'none'; });
      cancel.addEventListener('click', () => { form.style.display = 'none'; open.style.display = ''; note.textContent = ''; });
      go.addEventListener('click', async () => {
        if (!confirm(`Delete ${familyName} and all of its data forever?`)) return;
        note.textContent = '⏳ Deleting...';
        const r = await cloudCall('delete_family', { p_token: sessionStorage.getItem('kiddyKatDashToken'),
                                                     p_pin: pin.value, p_code: cleanFamilyCode(code.value) });
        if (!r.ok) { note.textContent = '⚠️ ' + r.error; return; }
        logOut();
        document.getElementById('code').value = '';           // don't leave the deleted family's login showing
        document.getElementById('pin').value = '';
        document.getElementById('loginNote').textContent = '✅ Your family was deleted. Thank you for using Kiddy Kat.';
      });
    }

    async function showFans() {
      const box = document.getElementById('fans');
      const result = await cloudCall('list_fans', { p_token: sessionStorage.getItem('kiddyKatDashToken') });
      box.textContent = '';
      const add = (parent, tag, text, cls) => { const el = document.createElement(tag); if (text !== undefined) el.textContent = text; if (cls) el.className = cls; parent.appendChild(el); return el; };
      add(box, 'h3', '👵 Fans: family who can send stars');
      if (!result.ok) { add(box, 'div', '⚠️ ' + result.error, 'empty'); return; }
      if (!result.fans.length) add(box, 'div', 'No fans yet. Add Grandma, Grandpa, an aunt or uncle.', 'empty');
      result.fans.forEach(f => {
        const row = add(box, 'div', undefined, 'fanRow');
        add(row, 'span', `${f.name}: up to ${f.weekly_limit} ⭐ per kid each week (${f.given_this_week} sent this week)`);
        const remove = add(row, 'button', 'Remove', 'plain');
        remove.addEventListener('click', async () => {
          if (!confirm(`Remove ${f.name}? They won't be able to send stars anymore.`)) return;
          await cloudCall('remove_fan', { p_token: sessionStorage.getItem('kiddyKatDashToken'), p_name: f.name });
          showFans();
        });
      });
      const open = add(box, 'button', '➕ Add a fan', 'small');
      const form = add(box, 'div', undefined, 'fanForm');
      open.addEventListener('click', () => { form.style.display = 'block'; open.style.display = 'none'; });
      const name = add(form, 'input'); name.placeholder = 'Name the kids call them, like Grandma';
      const pin = add(form, 'input'); pin.placeholder = 'Their own 4 to 6 digit PIN'; pin.inputMode = 'numeric';
      const limit = add(form, 'input'); limit.placeholder = 'Stars per kid each week (10 is a good start)'; limit.inputMode = 'numeric';
      const save = add(form, 'button', 'Add fan', 'small');
      const note = add(form, 'div');
      save.addEventListener('click', async () => {
        const r = await cloudCall('add_fan', { p_token: sessionStorage.getItem('kiddyKatDashToken'), p_name: name.value,
                                               p_pin: pin.value, p_weekly_limit: Number(limit.value) || 10 });
        if (!r.ok) { note.textContent = '⚠️ ' + r.error; return; }
        showFans();
      });
      const link = location.href.replace(/dashboard\.html.*$/, 'fan.html');
      add(box, 'div', `Send fans this link plus the family code, their name and their PIN: ${link}`, 'fanLink');
    }

    let uploadCounts = {};      // schoolwork photos waiting, by nickname

    // Reads one saved value safely ("null" if it's missing or broken)
    function read(data, key, fallback) {
      try { return data[key] ? JSON.parse(data[key]) : fallback; } catch (err) { return fallback; }
    }

    // Monday of this week, like "2026-10-26" (matches league.js on the phones)
    function mondayKey(date = new Date()) {
      const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
      d.setDate(d.getDate() - (d.getDay() + 6) % 7);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function money(cents) {
      return '$' + ((cents || 0) / 100).toFixed(2);
    }

    function ago(when) {
      const minutes = Math.round((Date.now() - new Date(when)) / 60000);
      if (minutes < 2) return 'just now';
      if (minutes < 60) return `${minutes} min ago`;
      const hours = Math.round(minutes / 60);
      if (hours < 24) return `${hours} hr ago`;
      const days = Math.round(hours / 24);
      return `${days} day${days === 1 ? '' : 's'} ago`;
    }

    // ---------- One kid's card ----------
    function kidCard(kid) {
      const data = kid.data || {};
      const today = new Date().toDateString();
      const card = document.createElement('div');
      card.className = 'kid';
      const add = (parent, tag, text, cls) => {
        const el = document.createElement(tag);
        if (text !== undefined) el.textContent = text;
        if (cls) el.className = cls;
        parent.appendChild(el);
        return el;
      };
      const section = title => { const s = add(card, 'div', undefined, 'section'); add(s, 'h3', title); return s; };
      const row = (parent, left, right, cls) => {
        const r = add(parent, 'div', undefined, 'row');
        add(r, 'span', left);
        add(r, 'span', right, cls);
      };

      // Header
      const head = add(card, 'div', undefined, 'kidHead');
      add(head, 'span', ANIMALS[kid.animal] || '🐱', 'face');
      const who = add(head, 'div');
      add(who, 'div', kid.nickname, 'name');
      add(who, 'div', Object.keys(data).length ? `Last active ${ago(kid.updated_at)}` : 'Not linked yet', 'seen');
      if (!Object.keys(data).length) return card;

      // Today's checklists
      const pets = read(data, 'kiddyKatPets', []);
      const pet = pets[Number(read(data, 'kiddyKatActivePet', 0))] || pets[0] || null;
      const wallet = read(data, 'kiddyKatWallet', null);
      const tasks = read(data, '_tasks', null);
      const checklist = read(data, 'kiddyKatChecklist', null);
      const checked = checklist && checklist.date === today ? checklist.done : [];
      const listsPaid = wallet && wallet.paidToday && wallet.paidToday.date === today ? wallet.paidToday.lists : [];

      const todayBox = section('✅ Today');
      const lg = read(data, '_league', null);
      const weekPoints = lg && lg.week === mondayKey() ? lg.points : 0;
      let offset = 0;
      LISTS.forEach(([key, label]) => {
        if (key === 'afternoon' && [0, 6].includes(new Date().getDay())) label = '🌤️ Afternoon';
        const items = tasks ? tasks[key] || [] : [];
        const doneHere = items.map((t, i) => checked.includes(offset + i));
        offset += items.length;
        const finished = (pet && pet.cared && pet.cared[key] === today) || listsPaid.includes(key) ||
                         (items.length && doneHere.every(d => d));
        const count = doneHere.filter(d => d).length;
        const r = add(todayBox, 'div', undefined, 'list');
        add(r, 'span', label);
        if (finished) add(r, 'span', '✅ Done', 'done');
        else if (count) add(r, 'span', `${count} of ${items.length}`, 'partial');
        else add(r, 'span', 'Not started', 'none');
        if (!finished && count) {
          const left = items.filter((t, i) => !doneHere[i]);
          add(todayBox, 'div', 'Still to do: ' + left.join(', '), 'left');
        }
      });

      const lgRow = add(todayBox, 'div', undefined, 'list');
      add(lgRow, 'span', '🏆 League points this week');
      add(lgRow, 'span', weekPoints >= 60 ? `${weekPoints} ⭐ goal!` : `${weekPoints} of 60`, weekPoints >= 60 ? 'done' : 'none');

      // 🦅 Career mode: this week's goals (numbers only)
      const cr = read(data, '_career', null);
      if (cr && cr.week === mondayKey()) {
        const crRow = add(todayBox, 'div', undefined, 'list');
        add(crRow, 'span', '🦅 Career goals this week');
        add(crRow, 'span', `${cr.done} of ${cr.target}`, cr.done >= cr.target ? 'done' : 'partial');
      }

      // 🔥 Morning streak
      const st = read(data, 'kiddyKatMorningStreak', null);
      if (st && st.days) {
        const stRow = add(todayBox, 'div', undefined, 'list');
        add(stRow, 'span', '🔥 Morning streak');
        add(stRow, 'span', `${st.current} day${st.current === 1 ? '' : 's'} · best ${st.best}${st.freezes ? ' · ❄️' + st.freezes : ''}`, st.current ? 'done' : 'none');
      }

      // Weekend Earn & Play: gaming hours used today
      const wk = read(data, '_weekend', null);
      if (wk && wk.date === new Date().toDateString() && (wk.hours || wk.gamingUntil)) {
        const wkRow = add(todayBox, 'div', undefined, 'list');
        add(wkRow, 'span', '🎮 Gaming today');
        const playingNow = wk.gamingUntil > Date.now()
          ? ` · playing until ${new Date(wk.gamingUntil).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}` : '';
        add(wkRow, 'span', `${wk.hours} of ${wk.cap} hours${playingNow}`, wk.hours >= wk.cap ? 'done' : 'partial');
      }

      // Waiting for a grown-up: decide right here. The kid's phone carries it out when it syncs.
      const rewards = read(data, 'kiddyKatRewardRequests', []).filter(r => r.status === 'waiting');
      const jobs = wallet ? wallet.jobRequests.filter(j => j.status === 'waiting') : [];
      const inbox = read(data, 'kiddyKatParentInbox', []);
      const sentFor = (type, target) => inbox.find(d => d.type === type && (target === undefined || d.target === target));
      const photos = uploadCounts[kid.nickname] || 0;
      if (rewards.length || jobs.length || (wallet && wallet.payoutDue) || photos) {
        const wait = section('🔔 Waiting for you');
        if (photos) {
          const box = add(wait, 'div', undefined, 'waiting');
          add(box, 'div', `📸 ${photos} schoolwork photo${photos === 1 ? '' : 's'} to check`);
          const go = add(add(box, 'div', undefined, 'buttons'), 'button', 'Open the grades page');
          go.addEventListener('click', () => window.open(location.href.replace(/dashboard\.html.*$/, 'grades.html'), '_blank'));
        }
        const item = (text, type, target, yesLabel, noLabel, extra = {}, alertName = '') => {
          const box = add(wait, 'div', undefined, 'waiting');
          add(box, 'div', text);
          const sent = sentFor(type, target);
          if (sent) {
            box.classList.add('sent');
            add(box, 'div', `⏳ You said ${sent.approved === false ? 'no' : 'yes'}. It updates when ${kid.nickname}'s phone opens Kiddy Kat.`);
            return;
          }
          const buttons = add(box, 'div', undefined, 'buttons');
          const decide = async approved => {
            buttons.textContent = '⏳ Sending...';
            const result = await cloudCall('parent_decide', { p_token: sessionStorage.getItem('kiddyKatDashToken'),
              p_nickname: kid.nickname, p_decision: { type: type, target: target, approved: approved, ...extra } });
            if (!result.ok) { buttons.textContent = '⚠️ ' + result.error; return; }
            // Alert the kid's phone (push.js)
            const token = sessionStorage.getItem('kiddyKatDashToken');
            if (type === 'reward') pushSend(token, approved ? 'yes' : 'no', alertName, kid.nickname);
            if (type === 'job' && approved) pushSend(token, 'paid', alertName, kid.nickname);
            if (type === 'payout') pushSend(token, 'paid', 'payday', kid.nickname);
            loadBoard();
          };
          add(buttons, 'button', yesLabel).addEventListener('click', () => decide(true));
          if (noLabel) {
            const no = add(buttons, 'button', noLabel, 'no');
            no.addEventListener('click', () => decide(false));
          }
        };
        rewards.forEach(r => item(`🎁 ${r.emoji || ''} ${r.name} (${r.price} ⭐)`, 'reward', r.id, '✅ Yes', '❌ Not this time', {}, r.name));
        jobs.forEach(j => item(`💵 ${j.emoji || ''} ${j.name} (${[j.cents ? money(j.cents) : '', j.stars ? j.stars + ' ⭐' : ''].filter(Boolean).join(' + ') || money(0)})`, 'job', j.id, '✅ Pay it', '↩️ Not done yet', {}, j.name));
        if (wallet && wallet.payoutDue) {
          item(`💸 Payday: hand over ${money(wallet.payoutDue)} (cash or Apple Cash)`, 'payout', undefined,
               '✅ I paid it', null, { cents: wallet.payoutDue });
        }
      }

      // Pet
      if (pet) {
        const petBox = section('🐾 Pet');
        let stage = 0;
        STAGE_POINTS.forEach((points, i) => { if ((pet.points || 0) >= points) stage = i; });
        const face = (PET_STAGES[pet.type] || PET_STAGES.kitten)[stage];
        row(petBox, `${face} ${pet.name}`, `${pet.stars || 0} ⭐`);
        if (pets.length > 1) row(petBox, 'Pet House', `${pets.length} pets`);
      }

      // Wallet
      if (wallet) {
        const walletBox = section('💵 Wallet');
        row(walletBox, 'Spend', money(wallet.spend));
        row(walletBox, 'Save', money(wallet.save));
        if (wallet.give) row(walletBox, 'Give', money(wallet.give));
        if (wallet.pastDue && wallet.pastDue.length) row(walletBox, '⚠️ Past-due bills', String(wallet.pastDue.length), 'partial');
      }

      // School
      const weekAgo = Date.now() - 7 * 24 * 60 * 60 * 1000;
      const practice = read(data, 'kiddyKatPractice', []).filter(p => new Date(p.date).getTime() >= weekAgo);
      const catchUp = read(data, 'kiddyKatCatchUp', null);
      const pack = read(data, 'kiddyKatPack', null);
      const catchLeft = catchUp ? catchUp.items.filter(i => !i.done).length : 0;
      if (practice.length || catchLeft || pack) {
        const school = section('📚 School');
        if (practice.length) {
          const right = practice.reduce((s, p) => s + p.correct, 0);
          const total = practice.reduce((s, p) => s + p.total, 0);
          row(school, 'Practice (7 days)', `${practice.length} rounds, ${Math.round(right / total * 100)}%`);
        }
        if (catchUp && catchUp.items.length) row(school, 'Catch-up left', String(catchLeft), catchLeft ? 'partial' : 'done');
        if (pack) row(school, `🧠 ${pack.title}`, `${pack.questions.length - pack.queue.length} of ${pack.questions.length} learned`);
      }

      // Star gifts: recent ones, and a button to send some
      const gifts = section('⭐ Gifts');
      if ((kid.gifts || []).length) {
        kid.gifts.slice(0, 5).forEach(g => add(gifts, 'div',
          `${g.from} sent ${g.stars} ⭐ ${new Date(g.at).toLocaleDateString([], { weekday: 'short' })}` + (g.note ? `: "${g.note}"` : ''), 'giftList'));
      } else {
        add(gifts, 'div', 'No gifts this week.', 'giftList');
      }
      const giftBox = add(gifts, 'div', undefined, 'gift');
      const amounts = add(giftBox, 'div', undefined, 'amounts');
      let picked = 0;
      [1, 3, 5, 10].forEach(n => {
        const b = add(amounts, 'button', `${n} ⭐`);
        b.addEventListener('click', () => {
          picked = n;
          amounts.querySelectorAll('button').forEach(x => x.classList.toggle('picked', x === b));
        });
      });
      const giftNote = add(giftBox, 'input');
      giftNote.placeholder = `Note for ${kid.nickname} (optional), like "For helping with groceries!"`;
      giftNote.maxLength = 80;
      const from = add(giftBox, 'input');
      from.placeholder = 'From (Dad, Mom...)';
      from.value = localStorage.getItem('kiddyKatDashFrom') || 'Dad';
      from.maxLength = 20;
      const send = add(giftBox, 'button', '⭐ Gift stars');
      const sentNote = add(giftBox, 'div', undefined, 'giftList');
      send.addEventListener('click', async () => {
        if (!picked) { sentNote.textContent = 'Pick how many stars first.'; return; }
        localStorage.setItem('kiddyKatDashFrom', from.value.trim() || 'Dad');
        const r = await cloudCall('parent_gift_stars', { p_token: sessionStorage.getItem('kiddyKatDashToken'),
          p_nickname: kid.nickname, p_stars: picked, p_note: giftNote.value, p_from: from.value });
        if (!r.ok) { sentNote.textContent = '⚠️ ' + r.error; return; }
        pushSend(sessionStorage.getItem('kiddyKatDashToken'), 'stars', String(picked), kid.nickname);
        loadBoard();
      });
      return card;
    }

    // Start: show the board if already logged in this tab; refresh every 2 minutes
    if (sessionStorage.getItem('kiddyKatDashToken')) loadBoard();
    setInterval(() => { if (sessionStorage.getItem('kiddyKatDashToken')) loadBoard(); }, 120000);
    document.getElementById('pin').addEventListener('keydown', e => { if (e.key === 'Enter') logIn(); });
  </script>
</body>
</html>
