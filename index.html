<!DOCTYPE html>
<html>
<head>
  <title>Kiddy Kat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link id="appIcon" rel="apple-touch-icon" href="icon.png">
  <script>
    // A link ending in ?icon=tiger or ?icon=lion uses that animal's home screen icon
    const iconChoice = new URLSearchParams(location.search).get('icon');
    if (iconChoice === 'tiger' || iconChoice === 'lion') {
      document.getElementById('appIcon').href = iconChoice + '.png';
    }
  </script>
  <style>
    /* Colors for each animal. The page uses var(--main) etc. everywhere. */
    body        { --main: #ff7a00; --soft: #ffd8a8; --bg: #fff4e6; }   /* kitten */
    body.tiger  { --main: #e8590c; --soft: #ffc078; --bg: #fff0e0; }
    body.lion   { --main: #b8860b; --soft: #ffe066; --bg: #fffbe6; }

    body { font-family: sans-serif; background: var(--bg); text-align: center; }
    h1 { font-size: 48px; color: var(--main); margin-bottom: 0; }
    #hello { font-size: 22px; margin-top: 4px; }
    .tabs button { font-size: 22px; padding: 12px 16px; margin: 4px;
                   border: none; border-radius: 16px; background: var(--soft); }
    .task { font-size: 28px; padding: 20px; margin: 12px auto; width: 80%;
            background: white; border-radius: 20px; cursor: pointer; }
    .done { background: #b6f2b6; text-decoration: line-through; }
    #today, #weather { font-size: 26px; border-radius: 20px; padding: 16px;
                       margin: 12px auto; width: 80%; }
    #today { background: #e7f5ff; }
    #weather { background: #fff9db; }
    .grownups { font-size: 16px; background: none; border: none; color: #999; margin: 30px; }
    #settings { display: none; background: white; border-radius: 20px; width: 80%;
                margin: 0 auto 30px; padding: 16px; font-size: 18px; text-align: left; }
    #settings table { width: 100%; border-collapse: collapse; }
    #settings td, #settings th { padding: 6px; border-bottom: 1px solid #eee; }
    #settings input, #settings select, #settings textarea {
      width: 100%; font-size: 16px; padding: 6px; box-sizing: border-box; font-family: sans-serif; }
    #settings textarea { height: 120px; }
    #settings label { display: block; font-weight: bold; margin-top: 12px; }
    #settings button, #setup button { font-size: 18px; padding: 10px 20px; margin-top: 12px; border: none;
                                      border-radius: 12px; background: var(--main); color: white; }

    /* First-time setup screen */
    #setup { display: none; position: fixed; inset: 0; background: var(--bg);
             padding-top: 12vh; z-index: 10; }
    #setup .animals { font-size: 64px; }
    #setup input { display: block; width: 70%; margin: 12px auto; font-size: 24px;
                   padding: 12px; border-radius: 12px; border: 2px solid var(--soft); text-align: center; }

    /* Virtual pet */
    #petCard { background: white; border-radius: 20px; width: 80%; margin: 12px auto;
               padding: 12px; font-size: 20px; }
    .petEmoji { font-size: 56px; display: inline-block; cursor: pointer; }
    .petEmoji.stage1 { font-size: 70px; }
    .petEmoji.stage2 { font-size: 88px; }
    .petEmoji.stage3 { font-size: 106px; }
    .bounce { animation: bounce 0.5s; }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-25px); } }
    #petName { font-weight: bold; margin: 4px; }
    #petMood { margin: 4px; }
    #petBar { background: #eee; border-radius: 10px; height: 14px; width: 70%; margin: 8px auto; overflow: hidden; }
    #petBarFill { background: var(--main); height: 100%; width: 0; }
    #petCard button, #petChooser button { font-size: 18px; padding: 10px 20px; margin-top: 8px; border: none;
                                          border-radius: 12px; background: var(--main); color: white; }
    #petChooser { display: none; position: fixed; inset: 0; background: var(--bg); padding-top: 10vh; z-index: 11; }
    #petChooser .petOption { font-size: 48px; background: white; color: black; margin: 6px;
                             border: 4px solid transparent; }
    #petChooser .petOption.picked { border-color: var(--main); }
    #petChooser input { display: block; width: 70%; margin: 16px auto; font-size: 24px; padding: 12px;
                        border-radius: 12px; border: 2px solid var(--soft); text-align: center; }

    #party { display: none; position: fixed; inset: 0; background: rgba(255,244,230,0.95); }
    #party .cat { font-size: 150px; display: inline-block; margin-top: 15vh;
                  animation: dance 0.5s infinite alternate; }
    #party h2 { font-size: 40px; color: var(--main); }
    #party .stickers { font-size: 64px; }
    @keyframes dance {
      from { transform: rotate(-15deg) translateY(0); }
      to   { transform: rotate(15deg) translateY(-30px); }
    }
  </style>
</head>
<body>
  <h1 id="title">🐱 Kiddy Kat</h1>
  <p id="hello"></p>

  <!-- Virtual pet -->
  <div id="petCard">
    <div id="petEmoji" class="petEmoji" onclick="petPoke()">🥚</div>
    <div id="petName"></div>
    <div id="petMood"></div>
    <div id="petBar"><div id="petBarFill"></div></div>
    <button id="petChooseButton" onclick="openPetChooser()">Choose your pet</button>
  </div>

  <div class="tabs">
    <button onclick="show('morning')">☀️ Morning</button>
    <button onclick="show('afternoon')">🎒 After School</button>
    <button onclick="show('bedtime')">🌙 Bedtime</button>
  </div>

  <div id="today"></div>
  <div id="weather">🌤️ Checking the weather...</div>

  <!-- The tasks are filled in by JavaScript from each kid's own lists -->
  <div id="morning" class="list"></div>
  <div id="afternoon" class="list"></div>
  <div id="bedtime" class="list"></div>

  <button class="grownups" onclick="toggleSettings()">⚙️ Grown-ups</button>

  <div id="settings">
    <h2>✅ My task lists</h2>
    <p>One task per line. Emoji are welcome!</p>
    <label>☀️ Morning</label>
    <textarea id="editMorning"></textarea>
    <label>🎒 After School</label>
    <textarea id="editAfternoon"></textarea>
    <label>🌙 Bedtime</label>
    <textarea id="editBedtime"></textarea>
    <button onclick="saveTasks()">Save tasks</button>
    <div id="taskStatus"></div>
    <hr>

    <h2>🗓️ Specials schedule</h2>
    <p>Pick the day for each special and write the tip in your own words.</p>
    <table>
      <thead><tr><th>Special</th><th>Day</th><th>Tip</th></tr></thead>
      <tbody id="specialRows"></tbody>
    </table>
    <button onclick="saveSpecials()">Save schedule</button>
    <div id="specialStatus"></div>
    <hr>

    <button onclick="changeProfile()">👤 Change who uses this phone</button>
  </div>

  <!-- First-time setup -->
  <div id="setup">
    <div class="animals">🐱 🐯 🦁</div>
    <h2>Who's using Kiddy Kat?</h2>
    <input id="setupName" placeholder="Your first name">
    <input id="setupAge" type="number" inputmode="numeric" placeholder="Your age">
    <button onclick="startProfile()">Let's go!</button>
  </div>

  <!-- Pick and name a pet -->
  <div id="petChooser">
    <h2>Pick your pet!</h2>
    <button class="petOption" id="option-kitten" onclick="pickPetType('kitten')">🐱</button>
    <button class="petOption" id="option-puppy" onclick="pickPetType('puppy')">🐶</button>
    <button class="petOption" id="option-bunny" onclick="pickPetType('bunny')">🐰</button>
    <button class="petOption" id="option-flower" onclick="pickPetType('flower')">🌻</button>
    <input id="petNameInput" placeholder="Your pet's name">
    <button onclick="hatchPet()">Hatch! 🥚</button>
  </div>

  <div id="party" onclick="this.style.display='none'">
    <div class="cat" id="partyAnimal">🐱</div>
    <h2 id="partyMessage">You did it!</h2>
    <div class="stickers" id="stickers"></div>
  </div>

  <script src="pet.js"></script>
  <script>
    // ---------- Starting task lists for each animal ----------
    const DEFAULT_TASKS = {
      kitten: {
        morning:   ['🪥 Brush teeth', '🛏️ Make bed', '👕 Get dressed', '🥪 Pack lunch'],
        afternoon: ['🎒 Unpack backpack', '🍎 Have a snack', '📚 Do homework'],
        bedtime:   ['🔌 Charge school devices', '👗 Pick out clothes for tomorrow', '🪥 Brush teeth']
      },
      tiger: {
        morning:   ['🪥 Brush teeth', '🍳 Eat breakfast', '🎒 Pack backpack', '🥪 Pack lunch'],
        afternoon: ['📚 Homework', '🧹 Chores', '🏀 Practice or activity'],
        bedtime:   ['🔌 Charge devices', '👕 Lay out clothes', '📖 Read 20 minutes']
      },
      lion: {
        morning:   ['🪥 Brush teeth', '🍳 Eat breakfast', '💻 Laptop and charger packed'],
        afternoon: ['📅 Check grades and assignments', '📚 Homework', '🧹 Chores'],
        bedtime:   ['🔌 Charge phone and laptop', '🎒 Pack for tomorrow', '😴 Screens off on time']
      }
    };

    // ---------- Profile: who uses this phone ----------
    function animalFor(age) {
      if (age <= 9)  return { emoji: '🐱', name: 'kitten', theme: 'kitten' };
      if (age <= 13) return { emoji: '🐯', name: 'tiger',  theme: 'tiger' };
      return                { emoji: '🦁', name: 'lion',   theme: 'lion' };
    }

    // Saved as a birth year, so the animal grows up with the kid
    let profile = JSON.parse(localStorage.getItem('kiddyKatProfile') || 'null');
    let animal = animalFor(7);
    let tasks = null;

    function applyProfile() {
      if (!profile) {
        document.getElementById('setup').style.display = 'block';
        return;
      }
      const age = new Date().getFullYear() - profile.birthYear;
      animal = animalFor(age);
      document.body.className = animal.theme;
      document.getElementById('title').textContent = `${animal.emoji} Kiddy Kat`;
      document.getElementById('hello').textContent = `Hi, ${profile.name}! You're a ${animal.name}!`;
      document.getElementById('partyAnimal').textContent = animal.emoji;
      if (!iconChoice && animal.theme !== 'kitten') {
        document.getElementById('appIcon').href = animal.theme + '.png';
      }
      document.getElementById('setup').style.display = 'none';

      // This kid's own lists, or the starting lists for their animal
      tasks = JSON.parse(localStorage.getItem('kiddyKatTasks') || 'null') || DEFAULT_TASKS[animal.theme];
      showTasks();
      showTaskEditor();
    }

    function startProfile() {
      const name = document.getElementById('setupName').value.trim();
      const age = Number(document.getElementById('setupAge').value);
      if (!name || !age) {
        alert('Please type your name and your age.');
        return;
      }
      profile = { name: name, birthYear: new Date().getFullYear() - age };
      localStorage.setItem('kiddyKatProfile', JSON.stringify(profile));
      applyProfile();
    }

    function changeProfile() {
      if (!confirm('Start over for a new person? This clears the name, tasks, pet and checkmarks on this phone.')) return;
      ['kiddyKatProfile', 'kiddyKatTasks', 'kiddyKatChecklist', 'kiddyKatPet'].forEach(k => localStorage.removeItem(k));
      profile = null;
      pet = null;
      showPet();
      document.getElementById('settings').style.display = 'none';
      applyProfile();
    }

    // ---------- Showing the task lists ----------
    function showTasks() {
      ['morning', 'afternoon', 'bedtime'].forEach(listName => {
        const box = document.getElementById(listName);
        box.innerHTML = '';
        tasks[listName].forEach(text => {
          const task = document.createElement('div');
          task.className = 'task';
          task.textContent = text;
          task.addEventListener('click', () => task.classList.toggle('done'));
          task.addEventListener('click', checkDone);
          task.addEventListener('click', saveProgress);
          box.appendChild(task);
        });
      });
      loadProgress();
    }

    function show(name) {
      document.querySelectorAll('.list').forEach(list => list.style.display = 'none');
      document.getElementById(name).style.display = 'block';
    }

    // ---------- Editing the task lists (Grown-ups) ----------
    function showTaskEditor() {
      document.getElementById('editMorning').value = tasks.morning.join('\n');
      document.getElementById('editAfternoon').value = tasks.afternoon.join('\n');
      document.getElementById('editBedtime').value = tasks.bedtime.join('\n');
    }

    function linesOf(id) {
      return document.getElementById(id).value.split('\n').map(t => t.trim()).filter(t => t);
    }

    function saveTasks() {
      tasks = {
        morning: linesOf('editMorning'),
        afternoon: linesOf('editAfternoon'),
        bedtime: linesOf('editBedtime')
      };
      localStorage.setItem('kiddyKatTasks', JSON.stringify(tasks));
      localStorage.removeItem('kiddyKatChecklist');   // lists changed, so start today's checkmarks fresh
      showTasks();
      document.getElementById('taskStatus').textContent = '✅ Saved! Your lists are updated.';
    }

    // ---------- Specials schedule (saved on this phone) ----------
    const DEFAULT_TIPS = {
      'PE': '🏃 PE day! Wear sneakers and comfy clothes 👟',
      'Art': '🎨 Art day! Wear clothes that can get messy',
      'Music': '🎵 Music day! Get ready to sing',
      'Library': '📚 Library day! Bring your library book back',
      'Computer Science': '💻 Computer day! Make sure your device is charged',
      'Health': '🍎 Health day!',
      'Humanities': '🌎 Humanities day!'
    };
    const DAYS = ['Not set', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];

    let specials = JSON.parse(localStorage.getItem('kiddyKatSpecials') || 'null')
      || Object.keys(DEFAULT_TIPS).map(n => ({ name: n, day: '', tip: DEFAULT_TIPS[n] }));

    function toggleSettings() {
      const box = document.getElementById('settings');
      box.style.display = box.style.display === 'block' ? 'none' : 'block';
    }

    function showSpecials() {
      document.getElementById('specialRows').innerHTML = specials.map((s, i) => `
        <tr>
          <td>${s.name}</td>
          <td><select id="day${i}">
            ${DAYS.map((d, n) => `<option value="${n === 0 ? '' : n}">${d}</option>`).join('')}
          </select></td>
          <td><input id="tip${i}"></td>
        </tr>`).join('');
      specials.forEach((s, i) => {
        document.getElementById('day' + i).value = s.day;
        document.getElementById('tip' + i).value = s.tip;
      });
    }

    function saveSpecials() {
      specials = specials.map((s, i) => ({
        name: s.name,
        day: document.getElementById('day' + i).value,
        tip: document.getElementById('tip' + i).value
      }));
      localStorage.setItem('kiddyKatSpecials', JSON.stringify(specials));
      showToday();
      document.getElementById('specialStatus').textContent = '✅ Saved! Check the blue card at the top.';
    }

    // ---------- What's today? card ----------
    function showToday() {
      const day = new Date().getDay();
      const todayCard = document.getElementById('today');
      const todaysTips = specials.filter(s => Number(s.day) === day).map(s => s.tip);

      if (day === 0 || day === 6) {
        todayCard.textContent = '🎉 No school today! Have fun!';
      } else if (todaysTips.length > 0) {
        todayCard.innerHTML = todaysTips.join('<br>');
      } else {
        todayCard.textContent = '🏫 School day! Have a great day!';
      }
    }

    // ---------- Weather card ----------
    const LAT = 36.17, LON = -115.14;   // Las Vegas

    async function showWeather() {
      const box = document.getElementById('weather');
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}` +
          '&current=temperature_2m' +
          '&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max' +
          '&temperature_unit=fahrenheit&timezone=auto&forecast_days=1';
        const data = await (await fetch(url)).json();

        const now = Math.round(data.current.temperature_2m);
        const high = Math.round(data.daily.temperature_2m_max[0]);
        const low = Math.round(data.daily.temperature_2m_min[0]);
        const rain = data.daily.precipitation_probability_max[0];

        const tips = [];
        if (low < 50) tips.push('🧥 Cold morning! Wear a warm jacket');
        else if (low < 65) tips.push('🧶 Chilly morning! Bring a sweater');
        if (high >= 95) tips.push('🥵 Hot day! Wear light clothes and bring water');
        if (rain >= 50) tips.push('☔ It might rain! Bring a raincoat');
        if (tips.length === 0) tips.push('😎 Nice weather today!');

        box.innerHTML = `🌡️ ${now}° now, up to ${high}° today<br>` + tips.join('<br>');
      } catch (err) {
        box.textContent = '🌤️ The weather is taking a nap. Look outside!';
      }
    }

    // ---------- Celebration ----------
    const stickers = ['⭐', '🌈', '🦄', '🍭', '🎈', '🌟', '🐶', '🌸'];

    function checkDone() {
      const list = this.parentElement;
      const total = list.querySelectorAll('.task').length;
      const done = list.querySelectorAll('.task.done').length;
      if (total > 0 && total === done) {
        const petMessage = carePet(list.id);          // feeds the pet (once per list per day)
        celebrate(petMessage ? 'You did it! ' + petMessage : 'You did it!', animal.emoji);
      }
    }

    // Shows the dancing screen with a message and 3 random stickers
    function celebrate(message, dancer) {
      let pick = '';
      for (let i = 0; i < 3; i++) {
        pick += stickers[Math.floor(Math.random() * stickers.length)];
      }
      document.getElementById('partyAnimal').textContent = dancer;
      document.getElementById('partyMessage').textContent = message;
      document.getElementById('stickers').textContent = pick;
      document.getElementById('party').style.display = 'block';
    }

    // ---------- Remember checkmarks until tomorrow ----------
    const todayKey = new Date().toDateString();

    function saveProgress() {
      const done = [...document.querySelectorAll('.task')]
        .map((task, i) => task.classList.contains('done') ? i : null)
        .filter(i => i !== null);
      localStorage.setItem('kiddyKatChecklist', JSON.stringify({ date: todayKey, done: done }));
    }

    function loadProgress() {
      const saved = JSON.parse(localStorage.getItem('kiddyKatChecklist') || 'null');
      if (!saved || saved.date !== todayKey) return;
      const tasks = document.querySelectorAll('.task');
      saved.done.forEach(i => tasks[i] && tasks[i].classList.add('done'));
    }

    // ---------- Start up ----------
    show('morning');
    showSpecials();
    showToday();
    showWeather();
    showPet();
    applyProfile();
  </script>
</body>
</html>
