<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kiddy Kat Fans</title>
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    :root { --main: #ff7a00; --bg: #fff4e6; --muted: #868e96; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); margin: 0; padding: 16px;
           color: #212529; text-align: center; font-size: 18px; }
    h1 { color: var(--main); margin: 8px 0 4px; font-size: 30px; }
    .sub { color: var(--muted); margin-bottom: 16px; }
    .card { max-width: 420px; margin: 14px auto; background: white; border-radius: 20px; padding: 20px; }
    input { display: block; width: 100%; font-size: 20px; padding: 12px; margin: 10px 0;
            border: 2px solid #ffd8a8; border-radius: 12px; text-align: center; }
    button { font-size: 20px; padding: 12px 22px; border: none; border-radius: 14px; background: var(--main);
             color: white; margin: 6px 4px; cursor: pointer; }
    button.plain { background: #eee; color: #333; font-size: 16px; }
    .face { font-size: 54px; }
    .kidName { font-size: 26px; font-weight: bold; }
    .left { color: var(--muted); margin: 4px 0 10px; }
    .amounts button { background: #fff3bf; color: #333; min-width: 70px; }
    .amounts button.picked { background: var(--main); color: white; }
    .amounts button:disabled { opacity: 0.35; }
    .note { margin-top: 10px; min-height: 24px; }
  </style>
</head>
<body>
  <h1>⭐ Kiddy Kat Fans</h1>
  <div class="sub" id="sub">Send stars and cheers to the kids</div>

  <div class="card" id="login">
    <p>Type what the kids' parent sent you.</p>
    <input id="code" placeholder="Family code" autocapitalize="characters">
    <input id="name" placeholder="Your fan name, like Grandma">
    <input id="pin" type="password" inputmode="numeric" placeholder="Your PIN">
    <button onclick="logIn()">Log in</button>
    <div class="note" id="loginNote"></div>
  </div>

  <div id="kids"></div>
  <button class="plain" id="logout" style="display:none" onclick="logOut()">Log out</button>

  <script src="config.js"></script>
  <script src="push.js"></script>
  <script>
    // =================================================================
    // A Fan (like a grandparent) can ONLY send stars and a short cheer,
    // up to a weekly limit their parent set. They can't see grades,
    // money or anything else. The login stays on this phone for 90 days.
    // =================================================================
    const ANIMALS = { kitten: '🐱', tiger: '🐯', lion: '🦁' };

    function cleanFamilyCode(text) {
      let code = String(text || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (code.startsWith('KAT') && code.length > 6) code = code.slice(3);
      return 'KAT-' + code;
    }

    async function cloudCall(name, args) {
      try {
        const response = await fetch(`${KIDDY_KAT_CLOUD.url}/rest/v1/rpc/${name}`, {
          method: 'POST', headers: { apikey: KIDDY_KAT_CLOUD.key, 'Content-Type': 'application/json' },
          body: JSON.stringify(args)
        });
        const body = await response.json().catch(() => ({}));
        return response.ok ? body : { ok: false, error: body.message || `Server error ${response.status}` };
      } catch (err) {
        return { ok: false, error: 'No internet right now' };
      }
    }

    function token() {
      try { return localStorage.getItem('kiddyKatFanToken'); } catch (err) { return null; }
    }

    async function logIn() {
      const note = document.getElementById('loginNote');
      note.textContent = '⏳ Checking...';
      const result = await cloudCall('fan_login', {
        p_code: cleanFamilyCode(document.getElementById('code').value),
        p_name: document.getElementById('name').value,
        p_pin: document.getElementById('pin').value
      });
      if (!result.ok) { note.textContent = '⚠️ ' + result.error; return; }
      try { localStorage.setItem('kiddyKatFanToken', result.token); } catch (err) {}
      note.textContent = '';
      showKids(result.token);
    }

    function logOut() {
      try { localStorage.removeItem('kiddyKatFanToken'); } catch (err) {}
      location.reload();
    }

    async function showKids(t = token()) {
      const status = await cloudCall('fan_status', { p_token: t });
      if (!status.ok) { logOut(); return; }
      document.getElementById('login').style.display = 'none';
      document.getElementById('logout').style.display = 'inline-block';
      document.getElementById('sub').textContent = `Hi, ${status.name}! Send stars and cheers to the ${status.family} kids.`;
      const box = document.getElementById('kids');
      box.textContent = '';
      status.kids.forEach(kid => box.appendChild(kidCard(kid, t)));
    }

    function kidCard(kid, t) {
      const card = document.createElement('div');
      card.className = 'card';
      const add = (parent, tag, text, cls) => { const el = document.createElement(tag); if (text !== undefined) el.textContent = text; if (cls) el.className = cls; parent.appendChild(el); return el; };
      add(card, 'div', ANIMALS[kid.animal] || '🐱', 'face');
      add(card, 'div', kid.nickname, 'kidName');
      add(card, 'div', kid.left > 0 ? `You can send ${kid.left} more ⭐ this week` : 'All stars sent this week! More on Monday.', 'left');
      if (kid.left <= 0) return card;

      const amounts = add(card, 'div', undefined, 'amounts');
      let picked = 0;
      [1, 3, 5].forEach(n => {
        const b = add(amounts, 'button', `${n} ⭐`);
        b.disabled = n > kid.left;
        b.addEventListener('click', () => {
          picked = n;
          amounts.querySelectorAll('button').forEach(x => x.classList.toggle('picked', x === b));
        });
      });
      const cheer = add(card, 'input');
      cheer.placeholder = `A cheer for ${kid.nickname}, like "So proud of you!"`;
      cheer.maxLength = 80;
      const send = add(card, 'button', `Send to ${kid.nickname}`);
      const note = add(card, 'div', undefined, 'note');
      send.addEventListener('click', async () => {
        if (!picked) { note.textContent = 'Tap how many stars first.'; return; }
        send.disabled = true;
        const r = await cloudCall('fan_gift_stars', { p_token: t, p_nickname: kid.nickname, p_stars: picked, p_note: cheer.value });
        send.disabled = false;
        if (!r.ok) { note.textContent = '⚠️ ' + r.error; return; }
        pushSend(t, 'stars', String(picked), kid.nickname);
        note.textContent = `🎉 Sent! ${kid.nickname} will see it the next time they open Kiddy Kat.`;
        setTimeout(() => showKids(t), 2500);
      });
      return card;
    }

    if (token()) showKids();
    document.getElementById('pin').addEventListener('keydown', e => { if (e.key === 'Enter') logIn(); });
  </script>
</body>
</html>
